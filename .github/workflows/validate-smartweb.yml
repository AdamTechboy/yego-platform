name: Validate SmartWeb build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yego_test
          POSTGRES_PASSWORD: yego_test_ci_only
          POSTGRES_DB: yego_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yego_test -d yego_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yego_test:yego_test_ci_only@127.0.0.1:5432/yego_test
      NIN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SESSION_SECRET: ci-testing-only-never-use-in-production
      NODE_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests (no production database)
        run: pnpm test
      - name: Apply migrations to isolated test PostgreSQL
        run: pnpm db:migrate
      - name: Seed isolated test database with demo fixtures
        run: pnpm db:seed:demo
      - name: Database integration tests (CI database only)
        run: pnpm test:integration
      - name: Build for standalone Node.js
        run: pnpm build
      - name: Verify standalone entry point
        run: |
          test -f dist/server/server.js
          test -d dist/client
          node --check server.mjs
      - name: Package SmartWeb deployment files
        run: |
          mkdir -p smartweb-release
          cp -R dist smartweb-release/dist
          cp server.mjs package.json pnpm-lock.yaml smartweb-release/
          cp -R scripts smartweb-release/
          mkdir -p smartweb-release/src/lib
          cp src/lib/nigeria.ts smartweb-release/src/lib/
          cp -R netlify/database/migrations smartweb-release/migrations
      - name: Upload SmartWeb build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yego-smartweb-${{ github.sha }}
          path: smartweb-release/
          if-no-files-found: error
          retention-days: 7
